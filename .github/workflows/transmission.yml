name: Build Transmission

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish IPKs as a GitHub Release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout package repository
        uses: actions/checkout@v4

      - name: Build Entware builder image
        run: |
          docker build \
            --pull \
            --tag entware-builder \
            docker/

      - name: Prepare directories
        run: |
          mkdir -p entware-work release
          chmod 777 entware-work release

      - name: Restore complete Entware build cache
        id: entware-cache
        uses: actions/cache@v4
        with:
          path: entware-work/Entware
          key: entware-full-x64-3.2-969c703-b6a6f29-gcc14-${{ hashFiles('transmission/entware.patch', 'transmission/packages.patch', 'transmission/entware.config', 'docker/Dockerfile') }}

      - name: Make restored Entware tree writable
        if: steps.entware-cache.outputs.cache-hit == 'true'
        run: |
          docker run --rm \
            --user root \
            -v "$GITHUB_WORKSPACE/entware-work:/work" \
            entware-builder \
            bash -c '
              chown -R me:me /work/Entware
              chmod -R u+rwX,go+rX /work/Entware
            '

      - name: Build Transmission
        env:
          CACHE_HIT: ${{ steps.entware-cache.outputs.cache-hit }}
        run: |
          docker run --rm \
            -e CACHE_HIT="$CACHE_HIT" \
            -v "$GITHUB_WORKSPACE/transmission:/patches:ro" \
            -v "$GITHUB_WORKSPACE/entware-work:/work" \
            -v "$GITHUB_WORKSPACE/release:/release" \
            entware-builder \
            bash -c '
              set -e

              if [ "$CACHE_HIT" != "true" ]; then

                  echo "=== No cache - prepare Entware tree ==="

                  cd /work

                  git clone https://github.com/Entware/Entware.git Entware
                  cd Entware

                  git checkout \
                    969c703e6fd8b2ad84d82affaeb14b48d1fcb105

                  echo
                  echo "=== Prepare feeds ==="

                  ./scripts/feeds update -a

                  git -C feeds/packages checkout \
                    b6a6f2962f62882b76dfe45f9f9e1238cd9b74fd

                  ./scripts/feeds install -a

                  echo
                  echo "=== Apply patches ==="

                  git apply /patches/entware.patch
                  git -C feeds/packages apply /patches/packages.patch

                  cp /patches/entware.config .config

                  echo
                  echo "=== Configure Entware ==="

                  make defconfig

                  echo
                  echo "=== Build GCC 14 toolchain ==="

                  make toolchain/install -j$(nproc) V=s

              else

                  echo "=== Complete Entware cache restored ==="

                  test -d /work/Entware
                  test -f /work/Entware/Makefile

              fi

              cd /work/Entware

              echo
              echo "=== Build Transmission ==="

              make package/feeds/packages/transmission/compile -j1 V=s

              echo
              echo "=== Collect IPKs ==="

              cp bin/targets/x64-3.2/generic-glibc/packages/transmission-runtime_4.1.3-1_x64-3.2.ipk /release/
              cp bin/targets/x64-3.2/generic-glibc/packages/transmission-daemon_4.1.3-1_x64-3.2.ipk /release/
              cp bin/targets/x64-3.2/generic-glibc/packages/transmission-cli_4.1.3-1_x64-3.2.ipk /release/
              cp bin/targets/x64-3.2/generic-glibc/packages/transmission-remote_4.1.3-1_x64-3.2.ipk /release/
              cp bin/targets/x64-3.2/generic-glibc/packages/transmission-web_4.1.3-1_all.ipk /release/

              cd /release

              sha256sum *.ipk > SHA256SUMS

              echo
              echo "=== Generated packages ==="
              ls -lh

              echo
              echo "=== SHA256 checksums ==="
              cat SHA256SUMS
            '

      - name: Make Entware tree cacheable
        run: |
          docker run --rm \
            --user root \
            -v "$GITHUB_WORKSPACE/entware-work:/work" \
            entware-builder \
            bash -c '
              chown -R me:me /work/Entware
              chmod -R u+rwX,go+rX /work/Entware
            '

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: transmission-4.1.3-1-x64-3.2
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="transmission-4.1.3-1"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists - replacing assets"

            gh release upload "$TAG" \
              release/* \
              --repo "${{ github.repository }}" \
              --clobber
          else
            echo "Creating release $TAG"

            gh release create "$TAG" \
              release/* \
              --repo "${{ github.repository }}" \
              --title "Transmission 4.1.3-1 for Entware x64-3.2" \
              --notes-file transmission/RELEASE.md
          fi
